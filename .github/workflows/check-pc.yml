        run: /tmp/v/bin/python tests/shoot_report_check.py --port 8873
      - name: The memory guard the video and Chrome tests run under
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard_check.py
      - name: The talking reel's arithmetic, against Nicole's numbers worked by hand
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/talking_engine_check.py
      - name: The talking reel's record (a save from the page field by field, the Talking folder, the chat's commands)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/talking_rec_check.py
      - name: Today's photo reels are still the CapCut projects kept from before the talking reel's builder
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/capcut_even.py
      - name: A talking reel made in CapCut (a pretend projects folder; CapCut is never started)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/talking_capcut_check.py
      - name: Talking reels the PC's way, tried on a Mac (the named gap)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_talking.py
      - name: The talking reel on the Mac's own Python 3.9 (nothing installed; these need nothing)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/guard_check.py && /usr/bin/python3 tests/talking_engine_check.py && /usr/bin/python3 tests/talking_rec_check.py && /usr/bin/python3 tests/capcut_even.py && /usr/bin/python3 tests/talking_capcut_check.py && /usr/bin/python3 tests/pc_talking.py
      - name: The words for a post and posting-day reminders on the Mac's own Python 3.9 (nothing installed; they need nothing)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/words_check.py && /usr/bin/python3 tests/reminders_check.py && /usr/bin/python3 tests/peek_check.py
      - name: On the Mac's own Python 3.9 with nothing installed (what a photographer's Mac runs; the PC-way checks say SKIP)
        if: ${{ !cancelled() }}
        env:
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: /usr/bin/python3 tests/pc_smoke.py
      - name: The photo pickers' locks and job check on the Mac's own Python 3.9 (the parts that draw photos say SKIP)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/pc_arrange.py
      - name: The reel's video helper on the Mac's own Python 3.9 (nothing installed; it needs nothing)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/video_check.py
      - name: The carousel designer's own machinery on the Mac's own Python 3.9 (nothing installed; it needs nothing)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/pc_design.py
      - name: Every script compiles on the Mac's own Python 3.9
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -m compileall -q plugins/the-engine/skills tests tools
      - name: Pack what a failed pc_smoke left behind
        # One archive, because a Mac's thumbnails have a colon in their names, which an upload refuses (Nov 7).
        if: ${{ failure() }}
        run: |
          if [ -d "$RUNNER_TEMP/pc-smoke-kept" ]; then tar -czf "$RUNNER_TEMP/pc-smoke-kept.tgz" -C "$RUNNER_TEMP" pc-smoke-kept; fi
      - name: Keep what a failed pc_smoke left behind
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: pc-smoke-mac
          path: ${{ runner.temp }}/pc-smoke-kept.tgz
          if-no-files-found: ignore
          retention-days: 7
  mac-talking:
    # Turning a talking video into words (Nicole's v23), with the PRETEND transcriber only: the real app is never
    # built or started here, so macOS is never given a reason to ask about Speech Recognition. The clips are 6 seconds
    # long and made here by the Mac's own AVFoundation. One video test at a time, under the memory guard.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Turning a talking video into words (the pretend transcriber, the sound, the job, its limits and its tidy-up), on the Mac's own Python 3.9
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/guard.py 800 /usr/bin/python3 tests/transcribe_check.py
      - name: The same on the newest Python this machine carries
        if: ${{ !cancelled() }}
        run: python3 tests/guard.py 800 python3 tests/transcribe_check.py
  mac-page:
    # The talking reel's real page, and the designer's small preview picture for the post kit, in a hidden Chrome on
    # GitHub's Mac. A job of its own that may fail without failing the check, as windows-page: nobody has seen these
    # pages in GitHub's Chrome yet, and a flaky first run must never block a push. One at a time, under the guard
    # (3000 MB: the guard counts a Chrome's shared memory once per helper, so a hidden Chrome alone reads about 1 GB).
    runs-on: macos-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - id: venv
        name: A Python with Pillow
        run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet pillow
      - name: Which Chrome this machine carries
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/chrome_drive.py --where
      - name: The talking reel page, whole (step 1, the script, the preview, the timeline, her words, the door on the reel page)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard.py 3000 /tmp/v/bin/python tests/talking_page_check.py
      - name: Several clips picked at once on the talking reel's timeline (Command-click, Shift-click, one zoom across clips side by side, one Undo)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard.py 3000 /tmp/v/bin/python tests/talking_multi_check.py
      - name: The two small menus for Speed and Zoom on the talking reel's timeline (open, choose, Mixed, Escape, the keys, phone width, the same saves as the chips)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard.py 3000 /tmp/v/bin/python tests/talking_menus_check.py
      - name: The editing queue after Nicole's v26 in a hidden Chrome (the check mark, Take out of my queue, the search over all four sections, Archive behind its question, Bring it back)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard.py 3000 /tmp/v/bin/python tests/edit_queue_v26_check.py
      - name: The home base and its two screens after Nicole's v26 in a hidden Chrome (the four cards and where each goes, Your backups with Show older and the search, 2 cards, Your post kits with Archive and Bring it back, phone width)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard.py 3000 /tmp/v/bin/python tests/home_base_check.py
      - name: The report after a backup in a hidden Chrome (the folders line, Open this folder said under its own button, Add to my editing queue, Pick again, Show me more, a shoot on two cards, phone width)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
