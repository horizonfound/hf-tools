      - name: The memory guard the video and Chrome tests run under
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard_check.py
      - name: The talking reel's arithmetic, against Nicole's numbers worked by hand
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
