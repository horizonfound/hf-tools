name: Check it on a Windows PC
# The Assistant has to work on a PC too (Dustin, Nov 6, 2026), and nobody here owns one. GitHub does:
# on every push that touches the scripts, this runs the parts that should already work on a real
# Windows machine, and stops any new Mac-only line (tools/check_pc.py):
#   tests/pc_smoke.py        the helper; a copy-and-check, and the same with nobody reading what it says;
#                            the walk-away check, also with Pillow hidden;
#                            a page server outliving the command that started it; moving a folder while a
#                            photo in it is held open; small pictures the PC way (made-up TIFF-style and
#                            CR3-style RAWs, a turned JPEG, a see-through PNG, a fake iPhone photo); the reel's
#                            song lengths and hearing them; then a whole backup start to finish (pictures, sort,
#                            sneak peeks, settle, every photo checked against the card, the records hidden),
#                            renames, and on Windows a settle and a rename while a photo is held open; the same
#                            backup with nobody reading what night.py says after its first line (| head -1),
#                            finishing with the same records as a twin read to the end; posts: a
#                            post kit built the PC way (sizes, a sideways photo upright), its words and day, the
#                            pickers' small copies, the posting queue with an emoji, a lock across two programs,
#                            Canva's downloads from a stand-in on 127.0.0.1, the posting server started and stopped
#                            (never the Studio folder's files through "%2e%2e", nothing for another host, a network
#                            path refused at once); the PC follow-up of Nov 6: curl run exactly as given (one more
#                            try only when Windows can't ask about a withdrawn certificate), the Instagram grid's
#                            list saved the PowerShell way (UTF-16), saving from six threads at once, never through
#                            a proxy, the editing queue's page server, CapCut's waiting list, the folder window's
#                            answer read back from a real Windows PowerShell, quoting for PowerShell; the report's
#                            page server (nothing for another host, report_url and queue_url through a dead proxy,
#                            Open photo folder refusing \\127.0.0.1\c$ without asking Windows about it, and
#                            still opening a report's own folder on a network drive); every
#                            say() changed on Nov 6 carrying on with nobody reading (on Windows "invalid argument",
#                            EINVAL, for real: the branch of each say() a Mac never takes)
#   tests/pc_arrange.py      the photo pickers' own machinery (arrange.py): small copies upright and never blown
#                            up, the lock across four programs, "is a slide job at work?", a child that outlives
#                            its starter, saving a record while it is open, a kit too deep for 260 characters, a
#                            copy held by the virus checker ("later"), a full drive, a background run's log lines
#   tests/pc_design.py       the carousel designer's own machinery (design.py), with real JPEGs written in plain
#                            Python so nothing has to be installed: a design saved while its file is open; names
#                            with an accent, an emoji, a word Windows keeps (CON), a dot at the end, 200 letters;
#                            staging and a save start to finish; the save's own process started with no window,
#                            its answer read back in an old code page; a save while a slide in the Carousel folder
#                            is held open by another program; a drive with no hard links; two saves at the same
#                            moment from two processes; the locks across programs; a slide's address past 260
#                            characters refused in plain words before anything is staged; nothing the page is
#                            given holds a path; every refusal of every designer route on the real page server
#                            leaves every file byte for byte as it was
#   tests/pc_reel_page.py    the reel page's own machinery (reel_page.py), nothing installed: Make my reel's
#                            refusals, a test make through its own process, a second press, the lock probe, a job
#                            stopped outright (this_computer.stop_tree), its one time limit, a recording's sound
#                            made once beside it and a new one beside a sound that can't be read; step 1's footage
#                            on header-only videos (one that plays as it is plays, with no strip; one still being
#                            copied in is waited for; the page's PC lines); the chat's footage look (footage.py): no
#                            sheets on a PC (exit 3, in plain words), moments checked and written, their own kept first
#   tests/pc_video.py        the reel's video helper (video.py), nothing installed: the facts read from video headers
#                            built byte by byte (the turn, H.264's profile and colour layout, HEVC, the recording
#                            time, the header at the end or the front, 64-bit boxes), what plays as it is, plain
#                            refusals of what isn't a video, and the named gap: no stills and no small copy on a
#                            PC yet, said in this_computer.NO_PREVIEW (HEVC_HELP for an iPhone's HEVC), nothing made;
#                            a video's sound read where it is (never copied) and brought down as it is read, on our
#                            own 3-second clip (tests/fixtures/loud-tone-3s.mp4) through Media Foundation
#   tests/pc_pictures.py    made-up RAW files from six camera makers, junk and damaged files
#   tests/backup_safety.py   never write over a file, never mix two cards, carry on a cut-off backup,
#                            never copy a card onto itself
#   tests/pc_servers.py      the page servers: a space in the path, never two on one port, the restart
#                            after an update (about 45 seconds)
#   tests/fixtures/check_sound.py   the reel's sound: lengths, the beat, Windows' own Media Foundation
#   tests/reel_timing_check.py      the reel's timing against Nicole's own (her acceptance cases on the synthetic
#                                   60-second test beat; the cases on a client's songs say SKIP here), clips in
#                                   reel.py make, and a clip written into a pretend CapCut project as a video
#   tests/fixtures/decode_report.py information only: what Windows' own decoder makes of the MP3 and M4A
#                                   songs with nothing extra installed (may fail without failing the check)
#   tests/pc_design_page.py  a job of its own, "windows-page", which may fail without failing the check (a first
#                            run in a browser nobody here has seen on Windows must never block a push): the
#                            designer's REAL page in the Chrome GitHub's Windows machine carries, hidden, driven by
#                            tests/chrome_drive.py: it loads with no error, draws six photos from copies the PC made,
#                            names the PC's own key (Alt), finds Georgia, loads the plugin's own font, saves six
#                            1080 x 1350 slides, and the hidden Chrome and its throwaway profile are gone afterwards.
#                            The full test of the page (tests/design_check.py) still needs a Mac: it stops without
#                            sips, draws its pretend shoots with sips under /private/tmp, and runs the page's rule
#                            scripts under the Mac's own JavaScript engine.
# Every script must also compile on the oldest Python we promise (3.9: a Mac's own, and a running page server
# that has loaded the reel's scripts only starts over onto new code that compiles there).
# Every test runs even when one before it failed (if: !cancelled()), so one red line never hides the rest.
# A failed pc_smoke keeps its scratch folder, and it is uploaded with the results ("pc-smoke-...").
# Python lanes on Windows: 3.9 (the oldest we promise, a Mac's own) and 3.14 (the newest that still uses the
# PC's own older code page by default, as a photographer's scripts do when Claude starts them); "3.x" is
# whatever is newest (3.15 turns UTF-8 on by default), and may fail without failing the check while Pillow
# catches up with it. The Mac job also runs pc_smoke once in an old code page (Latin-1), which is the same test.
# No screen, no memory card, no CapCut, no Claude app; a real PC tester is still needed for those.
# Nothing here posts anywhere or uses a secret.
on:
  workflow_dispatch:
  push:
    paths: ["plugins/**", "tests/pc_*.py", "tests/backup_safety.py", "tests/chrome_drive.py", "tests/fixtures/**", "tests/reel_timing_check.py",
            "tests/video_check.py", "tests/video_fixes_check.py", "tools/check_pc.py", ".github/workflows/check-pc.yml"]
  pull_request:
    paths: ["plugins/**", "tests/pc_*.py", "tests/backup_safety.py", "tests/chrome_drive.py", "tests/fixtures/**", "tests/reel_timing_check.py",
            "tests/video_check.py", "tests/video_fixes_check.py", "tools/check_pc.py", ".github/workflows/check-pc.yml"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
        experimental: [false]
        include:
          - python: "3.x"
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: No new Mac-only lines
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tools/check_pc.py
      - name: Every script compiles on this Python
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python -m compileall -q plugins/the-engine/skills tests tools
      - name: What this PC looks like to the Assistant
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python plugins/the-engine/skills/studio-manager/scripts/this_computer.py
      - name: Pillow, the one picture add-on a PC needs
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python -m pip install --quiet pillow
      - name: The parts that should already work on a PC, and a whole backup
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        env:
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: python tests/pc_smoke.py
      - name: Pictures from RAW files, the PC way
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_pictures.py
      - name: The backup's promises (never overwrite, never mix cards, never onto the card)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/backup_safety.py
      - name: The page servers (restart after an update, never two on one port)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_servers.py
      - name: The photo pickers' own machinery (locks, the job check, small copies, saving while open, a held copy)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_arrange.py
      - name: The carousel designer's own machinery (names, a held slide, no window, two saves at once, 260 characters, every refusal)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_design.py
      - name: The reel page's own machinery (Make my reel's refusals, the job and its lock, its one limit, stopping a job, a recording's sound made once)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_reel_page.py
      - name: The reel's video helper (facts from the header, what plays as it is, the named gap for stills and the copy)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_video.py
      - name: The reel's sound (lengths, the beat, Windows' own Media Foundation)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/fixtures/check_sound.py
      - name: The reel's timing, against Nicole's own (her cases on the test beat; clips; a clip as a video in CapCut's project)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/reel_timing_check.py
      - name: Information only - Windows' own decoder on the MP3 and M4A songs, nothing extra installed
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        continue-on-error: true
        env:
          ASSISTANT_NO_FFMPEG: "1"
        run: python tests/fixtures/decode_report.py
      - name: Keep what a failed pc_smoke left behind
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: pc-smoke-windows-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pc-smoke-kept
          if-no-files-found: ignore
          retention-days: 7
  windows-page:
    # The designer's real page in a hidden Chrome on Windows. A job of its own that may fail without failing the
    # check: nobody here has seen this page in a browser on Windows yet, and a flaky first run must never block a
    # push. When it fails, the picture of the page and the logs are kept ("pc-design-page").
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Pillow, the one picture add-on a PC needs
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python -m pip install --quiet pillow
      - name: Which Chrome this machine carries
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/chrome_drive.py --where
      - name: The carousel designer's real page in a hidden Chrome (loads, draws, saves six slides, Chrome gone afterwards)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        env:
          ASSISTANT_PAGE_KEEP: ${{ runner.temp }}/pc-design-page-kept
        run: python tests/pc_design_page.py
      - name: Keep the picture of the page and the logs of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: pc-design-page
          path: ${{ runner.temp }}/pc-design-page-kept
          if-no-files-found: ignore
          retention-days: 7
  mac:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: venv
        name: A Python with Pillow
        run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet pillow
      - name: No new Mac-only lines
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tools/check_pc.py
      - name: The same tests on a Mac, so a PC fix never breaks the Mac
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        env:
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: /tmp/v/bin/python tests/pc_smoke.py
      - name: The same again in an old code page (Latin-1), the way a PC's scripts run on Python 3.9 to 3.14
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        env:
          LC_ALL: en_US.ISO8859-1
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: /tmp/v/bin/python tests/pc_smoke.py
      - name: Pictures from RAW files
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_pictures.py
      - name: The backup's promises
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/backup_safety.py
      - name: The page servers
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_servers.py
      - name: The photo pickers' own machinery, the Mac's way of making pictures (sips)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_arrange.py
      - name: The photo pickers' own machinery again, the PC's way of making pictures (Pillow; a held copy, a full drive)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        env:
          ASSISTANT_NO_SIPS: "1"
        run: /tmp/v/bin/python tests/pc_arrange.py
      - name: The carousel designer's own machinery, so a PC fix never breaks the Mac
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_design.py
      - name: The reel page's own machinery, so a PC fix never breaks the Mac
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_reel_page.py
      - name: The reel's video helper, the PC's way (headers built byte by byte; the named gap, tried on a Mac)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_video.py
      - name: The reel's video helper on real clips the Mac's AVFoundation makes (facts, stills by colour, loudness, the copy)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/video_check.py
      - name: The reel's video helper after its reviewers (one video program at a time, none left running, files still copying in)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/video_fixes_check.py
      - name: The reel's sound
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/fixtures/check_sound.py
      - name: The reel's timing, against Nicole's own
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/reel_timing_check.py
      - name: On the Mac's own Python 3.9 with nothing installed (what a photographer's Mac runs; the PC-way checks say SKIP)
        if: ${{ !cancelled() }}
        env:
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: /usr/bin/python3 tests/pc_smoke.py
      - name: The photo pickers' locks and job check on the Mac's own Python 3.9 (the parts that draw photos say SKIP)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/pc_arrange.py
      - name: The reel's video helper on the Mac's own Python 3.9 (nothing installed; it needs nothing)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/video_check.py
      - name: The carousel designer's own machinery on the Mac's own Python 3.9 (nothing installed; it needs nothing)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/pc_design.py
      - name: Every script compiles on the Mac's own Python 3.9
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -m compileall -q plugins/the-engine/skills tests tools
      - name: Pack what a failed pc_smoke left behind
        # One archive, because a Mac's thumbnails have a colon in their names, which an upload refuses (Nov 7).
        if: ${{ failure() }}
        run: |
          if [ -d "$RUNNER_TEMP/pc-smoke-kept" ]; then tar -czf "$RUNNER_TEMP/pc-smoke-kept.tgz" -C "$RUNNER_TEMP" pc-smoke-kept; fi
      - name: Keep what a failed pc_smoke left behind
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: pc-smoke-mac
          path: ${{ runner.temp }}/pc-smoke-kept.tgz
          if-no-files-found: ignore
          retention-days: 7
