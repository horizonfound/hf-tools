permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
        experimental: [false]
        include:
          - python: "3.x"
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: No new Mac-only lines
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tools/check_pc.py
      - name: Every script compiles on this Python
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python -m compileall -q plugins/the-engine/skills tests tools
      - name: What this PC looks like to the Assistant
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python plugins/the-engine/skills/studio-manager/scripts/this_computer.py
      - name: Pillow, the one picture add-on a PC needs
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python -m pip install --quiet pillow
      - name: The parts that should already work on a PC, and a whole backup
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        env:
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: python tests/pc_smoke.py
      - name: Pictures from RAW files, the PC way
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_pictures.py
      - name: The backup's promises (never overwrite, never mix cards, never onto the card)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/backup_safety.py
      - name: A backup with no questions before the copy (the drive chosen by itself, the one question)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/backup_zero_check.py
      - name: A second copy made after the backup (three hashes agree, nothing written over, the manifest changed only at the end, one at a time)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/second_copy_check.py
      - name: The other options on the report (another card, the folder naming, the next drive, the note line, every POST for the report's own page only)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/report_options_check.py
      - name: The page servers (restart after an update, never two on one port)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_servers.py
      - name: The photo pickers' own machinery (locks, the job check, small copies, saving while open, a held copy)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_arrange.py
      - name: The carousel designer's own machinery (names, a held slide, no window, two saves at once, 260 characters, every refusal)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_design.py
      - name: The reel page's own machinery (Make my reel's refusals, the job and its lock, its one limit, stopping a job, a recording's sound made once)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_reel_page.py
      - name: The reel's video helper (facts from the header, what plays as it is, the named gap for stills and the copy)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_video.py
      - name: The reel's sound (lengths, the beat, Windows' own Media Foundation)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/fixtures/check_sound.py
      - name: The reel's timing, against Nicole's own (her cases on the test beat; clips; a clip as a video in CapCut's project)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/reel_timing_check.py
      - name: Every vibe lands on the song's real hits (Nicole's v25 - the three steps on a loose song made here, No song in every vibe, whole frames, the chat's reel maker)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/reel_hits_check.py
      - name: Photo numbers stay fixed when photos are added (Nicole's v27 - reel.py sheet keeps every number, new photos take the next, a photo gone keeps its number unused)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/sheet_numbers_check.py
      - name: The words for a post (the record, Nicole's rules for writing and asking)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/words_check.py
      - name: A newer version is ready - the check and its how-to page
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/updates_check.py
      - name: The words page (every route and refusal, the queue step; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/words_page_check.py --no-chrome
      - name: The post kit's three steps (every state of Your words and Add to my queue, no link inside a link; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/kit_steps_check.py --no-chrome
      - name: The posting queue's panel for a post (the grid photo picker, Copy caption, two shoots whose names shorten alike; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/posting_panel_check.py --no-chrome
      - name: Posted, on the post itself, after Nicole's v27 (which posted posts the grid shows, the switch back to Not posted and its refusals, the command line; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/posting_posted_check.py --no-chrome
      - name: The editing queue after Nicole's v26 (Mark as delivered, Take out of my queue, Uploaded shoots, Delivered, Archived - every press and refusal, her words; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/edit_queue_v26_check.py --no-chrome
      - name: The home base and its two screens after Nicole's v26 (what Back up a card and Make posts read, the cards of one shoot as one backup, a sample never safe to format, Archive and Bring it back, every refusal, her words; the pages in a browser are checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/home_base_check.py --no-chrome
      - name: The report after a backup, as Nicole's notes ask (why several folders, Does everything look right, each shoot's own Open this folder and its route, the sneak peeks said truly for RAW and JPEG, the next step; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/report_v26_check.py --no-chrome
      - name: The editing queue's animations after Nicole's v28 (her lines, the delivered side built with the shoot's name as text; the deal and the flip in a browser are checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/edit_queue_v28_check.py --no-chrome
      - name: Posted lifts the post into the feed, after Nicole's v28 (her line and the page's own promises, read from the script; the lift in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/posting_lift_check.py --no-chrome
      - name: The backup report plays the backup back, after Nicole's v28 (which reports get the animation and which never do, the real numbers in the page as written; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/report_fall_check.py --no-chrome
      - name: Posting-day reminders on the posting page (a pretend calendar only - the background round, a slow or failing calendar, the command line, the PC's calendar files; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/posting_reminders_page_check.py --no-chrome
      - name: Posting-day reminders themselves (a pretend calendar only - Nicole's 19 checks, the calendar file a PC gets, the steady id per post, the command line)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/reminders_check.py
      - name: The instructions say what the scripts do (the words, the kit, the posting queue, reminders, the PC part)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/skill_text_check.py
      - name: The face check and the stricter sneak-peek pick (pretend faces; a PC has no Vision, so the pages say so)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/peek_check.py
      - name: One report for a shoot on several cards (the link, the card pages, the shoot page, the server's /card/N/ routes)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/shoot_report_check.py --port 8873
      - name: The talking reel's arithmetic, against Nicole's numbers worked by hand
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/talking_engine_check.py
      - name: The talking reel's record (a save from the page field by field, the Talking folder, the chat's commands)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/talking_rec_check.py
      - name: A talking reel made in CapCut (the project, the maker and its job, into a pretend projects folder; CapCut is never started)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/talking_capcut_check.py
      - name: Talking reels on a PC (the named gap - Edit my video answers with the PC line at once and makes nothing)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/pc_talking.py
      - name: The talking reel page (every route and refusal; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/talking_page_check.py --no-chrome
      - name: Several clips picked at once on the talking reel's timeline (our words, one zoom across a run in the CapCut plan; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/talking_multi_check.py --no-chrome
      - name: The two small menus for Speed and Zoom on the talking reel's timeline (our words, the bar; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/talking_menus_check.py --no-chrome
      - name: The centered line on the talking reel's preview (the line in the page, hidden from screen readers, its styles ours; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/talking_snap_check.py --no-chrome
      - name: Several reels from one shoot (Nicole's v25 - every reel fully separate, the two bars' routes, the chat's commands; the pages in a browser are checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/reels_check.py --no-chrome
      - name: Reels brought over from the older pages (bring_older.py - look changes nothing, numbers matched by file name, nothing written over, safe to run twice, a cut-off run finished by the next)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/bring_older_check.py
      - name: The post kit and the posting queue with several reels, captions optional (Nicole's v25 - each reel its own piece, no id renamed, the cover picker's photos per reel, the chat's ready --reel, reminders on a pretend calendar; the pages in a browser are checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/kit_reels_queue_check.py --no-chrome
      - name: The photographer picks (Nicole's v25 - nothing picked until they ask, the photo note per reel, what the assistant reads before it picks; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/picks_ask_check.py --no-chrome
      - name: Trim a clip and select several photos (Nicole's v25 - her words, a trim by request kept 1 to 15 seconds and inside its video; the page in a browser is checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/reel_trim_select_check.py --no-chrome
      - name: The reel page rebuilt (Nicole's v27 - the chooser of four kinds, each kind its own page, a reel's own kind, new photos numbered on the page's poll with the numbers kept, the song drop-down and Listen by request, the queue button's routes; the pages in a browser are checked on the Mac)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/reel_v27_page_check.py --no-chrome
      - name: Songs (Nicole's v25 - a short song starts after a glitch and a silence, measured with nothing installed; a replaced recording's sound taken again as "sound 2"; and her v27's Remove this song - a song and its sounds to the Trash, never a delete, the open reel's pick cleared)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/songs_check.py
      - name: The Trash helper (Nicole's v27 - the computer's own Recycle Bin through Windows' own call, nothing installed, never a delete; a link, a path outside its folder and a drive with no bin refused; every path checked before the first move; no test touches the real bin)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/trash_check.py
      - name: Loose ends of Nicole's v25 and v26 (no page says to tell Claude; every shoot in Your Content is listed, with or without its page; the instructions and both setup guides match the home base)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/loose_ends_v26_check.py
      - name: Information only - Windows' own decoder on the MP3 and M4A songs, nothing extra installed
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        continue-on-error: true
        env:
          ASSISTANT_NO_FFMPEG: "1"
        run: python tests/fixtures/decode_report.py
      - name: Keep what a failed pc_smoke left behind
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: pc-smoke-windows-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pc-smoke-kept
          if-no-files-found: ignore
          retention-days: 7
  windows-page:
    # The designer's real page in a hidden Chrome on Windows. A job of its own that may fail without failing the
    # check: nobody here has seen this page in a browser on Windows yet, and a flaky first run must never block a
    # push. When it fails, the picture of the page and the logs are kept ("pc-design-page").
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Pillow, the one picture add-on a PC needs
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python -m pip install --quiet pillow
      - name: Which Chrome this machine carries
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        run: python tests/chrome_drive.py --where
      - name: The carousel designer's real page in a hidden Chrome (loads, draws, saves six slides, Chrome gone afterwards)
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        env:
          ASSISTANT_PAGE_KEEP: ${{ runner.temp }}/pc-design-page-kept
        run: python tests/pc_design_page.py
      - name: Keep the picture of the page and the logs of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: pc-design-page
          path: ${{ runner.temp }}/pc-design-page-kept
          if-no-files-found: ignore
          retention-days: 7
  mac:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: venv
        name: A Python with Pillow
        run: python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet pillow
      - name: No new Mac-only lines
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tools/check_pc.py
      - name: This workflow file is one GitHub will run (it parses; every step's condition names a step its own job has)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/workflow_check.py
      - name: The same tests on a Mac, so a PC fix never breaks the Mac
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        env:
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: /tmp/v/bin/python tests/pc_smoke.py
      - name: The same again in an old code page (Latin-1), the way a PC's scripts run on Python 3.9 to 3.14
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        env:
          LC_ALL: en_US.ISO8859-1
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
          ASSISTANT_SMOKE_KEEP: ${{ runner.temp }}/pc-smoke-kept
        run: /tmp/v/bin/python tests/pc_smoke.py
      - name: Pictures from RAW files
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_pictures.py
      - name: The backup's promises
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/backup_safety.py
      - name: A backup with no questions before the copy
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/backup_zero_check.py
      - name: A second copy made after the backup
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/second_copy_check.py
      - name: The other options on the report
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/report_options_check.py
      - name: The page servers
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_servers.py
      - name: The photo pickers' own machinery, the Mac's way of making pictures (sips)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_arrange.py
      - name: The photo pickers' own machinery again, the PC's way of making pictures (Pillow; a held copy, a full drive)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        env:
          ASSISTANT_NO_SIPS: "1"
        run: /tmp/v/bin/python tests/pc_arrange.py
      - name: The carousel designer's own machinery, so a PC fix never breaks the Mac
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_design.py
      - name: The reel page's own machinery, so a PC fix never breaks the Mac
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/pc_reel_page.py
      - name: Songs (a short song starts after a glitch and a silence; a replaced recording's sound taken again, for real with the Mac's own afconvert; and her v27's Remove this song - a song and its sounds to the Trash, never a delete, the open reel's pick cleared)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/songs_check.py
      - name: The Trash helper (Nicole's v27 - Finder's own Trash through osascript with the path as an argument, never a delete; a link, a path outside its folder and a drive with no Trash refused; every path checked before the first move; no test touches the real Trash)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/trash_check.py
      - name: Loose ends of Nicole's v25 and v26 (no page says to tell Claude; every shoot in Your Content is listed, with or without its page; the instructions and both setup guides match the home base)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/loose_ends_v26_check.py
      - name: The home page after Nicole's v28, everything but the page in a browser (the face finder, what the page reads and draws, her four steps, the recap card hidden and back, the Your year bar's dates, the routes)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/home_v28_check.py --no-chrome
      - name: The home page after Nicole's v29, posts first, everything but the page in a browser (the order of the cards, Create or See all my post kits, no list of kits, what went, the Back up a card screen without its Step 1 line)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/home_v29_check.py --no-chrome
      - name: The vault as a real post kit whose photo list is references (made once, two shoots' same-named photos as two numbers, numbers that never move, every other post kit unchanged, the readers and the page server by request)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        run: /tmp/v/bin/python tests/guard.py 3000 /tmp/v/bin/python tests/vault_core_check.py
      - name: Your year and the monthly recap after Nicole's v28, everything but the page in a browser (a PNG really a PNG, every count from its own record, the routes, saving a story never over a file)
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
