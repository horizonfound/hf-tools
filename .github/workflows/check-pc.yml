#                                   the path at the top; the real page in a hidden Chrome. On Windows the same machinery, without
#                                   a page, is part 16 of tests/pc_design.py, and the buttons on the real page are looked for in
#                                   tests/pc_design_page.py ("windows-page").
#   tests/design_v26_check.py       Nicole's v26 for the stories designer, in "mac-page" too (it draws its pretend kits
#                                   with the Mac's sips): sets of stories, the note and the line of "Let my assistant
#                                   choose the photos", design.py story-note and story-fill, her four story templates
#                                   (My editing queue filled from the editing queue), Redo, the x on a story's label.
#                                   On Windows the same machinery, without a page, is part 15 of tests/pc_design.py.
#   tests/fixtures/decode_report.py information only: what Windows' own decoder makes of the MP3 and M4A
#                                   songs with nothing extra installed (may fail without failing the check)
#   tests/pc_design_page.py  a job of its own, "windows-page", which may fail without failing the check (a first
#                            run in a browser nobody here has seen on Windows must never block a push): the
#                            designer's REAL page in the Chrome GitHub's Windows machine carries, hidden, driven by
#                            tests/chrome_drive.py: it loads with no error, draws six photos from copies the PC made,
#                            names the PC's own key (Alt), finds Georgia, loads the plugin's own font, saves six
#                            1080 x 1350 slides, and the hidden Chrome and its throwaway profile are gone afterwards.
#                            The full test of the page (tests/design_check.py) still needs a Mac: it stops without
#                            sips, draws its pretend shoots with sips under /private/tmp, and runs the page's rule
#                            scripts under the Mac's own JavaScript engine.
# Every script must also compile on the oldest Python we promise (3.9: a Mac's own, and a running page server
# that has loaded the reel's scripts only starts over onto new code that compiles there).
# Every test runs even when one before it failed (if: !cancelled()), so one red line never hides the rest.
# A failed pc_smoke keeps its scratch folder, and it is uploaded with the results ("pc-smoke-...").
# Python lanes on Windows: 3.9 (the oldest we promise, a Mac's own) and 3.14 (the newest that still uses the
# PC's own older code page by default, as a photographer's scripts do when Claude starts them); "3.x" is
# whatever is newest (3.15 turns UTF-8 on by default), and may fail without failing the check while Pillow
# catches up with it. The Mac job also runs pc_smoke once in an old code page (Latin-1), which is the same test.
# No screen, no memory card, no CapCut, no Claude app; a real PC tester is still needed for those.
# Nothing here posts anywhere or uses a secret.
on:
  workflow_dispatch:
  push:
    paths: ["plugins/**", "tests/pc_*.py", "tests/backup_safety.py", "tests/chrome_drive.py", "tests/fixtures/**", "tests/reel_timing_check.py", "tests/reel_hits_check.py", "tests/sheet_numbers_check.py", "tests/words_check.py", "tests/updates_check.py", "tests/words_page_check.py", "tests/kit_steps_check.py", "tests/posting_panel_check.py", "tests/edit_queue_v26_check.py", "tests/home_base_check.py", "tests/report_v26_check.py", "tests/posting_reminders_page_check.py", "tests/reminders_check.py", "tests/skill_text_check.py", "tests/peek_check.py", "tests/fake_night.py", "tests/shoot_report_check.py",
            "tests/video_check.py", "tests/video_fixes_check.py", "tests/talking_*.py", "tests/reels_check.py", "tests/bring_older_check.py", "tests/kit_reels_queue_check.py", "tests/picks_ask_check.py", "tests/reel_trim_select_check.py", "tests/reel_v27_page_check.py", "tests/reel_watch_check.py", "tests/reel_footage_check.py", "tests/songs_check.py", "tests/trash_check.py", "tests/loose_ends_v26_check.py", "docs/SETUP-GUIDE*.md", "tests/transcribe_check.py", "tests/capcut_even.py", "tests/guard.py", "tests/guard_check.py", "tests/posting_posted_check.py",
            "tests/design_preview_check.py", "tests/design_v26_check.py", "tests/design_check.py", "tests/design_v27_check.py", "tests/kit_cards_check.py", "tools/check_pc.py",
