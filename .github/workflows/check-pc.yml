name: Check it on a Windows PC
# The Assistant has to work on a PC too (Dustin, Nov 6, 2026), and nobody here owns one. GitHub does:
# on every push that touches the scripts, this runs the parts that should already work on a real
# Windows machine, and stops any new Mac-only line (tools/check_pc.py):
#   tests/pc_smoke.py        the helper; a copy-and-check, and the same with nobody reading what it says;
#                            the walk-away check, also with Pillow hidden;
#                            a page server outliving the command that started it; moving a folder while a
#                            photo in it is held open; small pictures the PC way (made-up TIFF-style and
#                            CR3-style RAWs, a turned JPEG, a see-through PNG, a fake iPhone photo); the reel's
#                            song lengths and hearing them; then a whole backup start to finish (pictures, sort,
#                            sneak peeks, settle, every photo checked against the card, the records hidden),
#                            renames, and on Windows a settle and a rename while a photo is held open; the same
#                            backup with nobody reading what night.py says after its first line (| head -1),
#                            finishing with the same records as a twin read to the end; posts: a
#                            post kit built the PC way (sizes, a sideways photo upright), its words and day, the
#                            pickers' small copies, the posting queue with an emoji, a lock across two programs,
#                            Canva's downloads from a stand-in on 127.0.0.1, the posting server started and stopped
#                            (never the Studio folder's files through "%2e%2e", nothing for another host, a network
#                            path refused at once); the PC follow-up of Nov 6: curl run exactly as given (one more
#                            try only when Windows can't ask about a withdrawn certificate), the Instagram grid's
#                            list saved the PowerShell way (UTF-16), saving from six threads at once, never through
#                            a proxy, the editing queue's page server, CapCut's waiting list, the folder window's
#                            answer read back from a real Windows PowerShell, quoting for PowerShell; the report's
#                            page server (nothing for another host, report_url and queue_url through a dead proxy,
#                            Open photo folder refusing \\127.0.0.1\c$ without asking Windows about it, and
#                            still opening a report's own folder on a network drive); every
#                            say() changed on Nov 6 carrying on with nobody reading (on Windows "invalid argument",
#                            EINVAL, for real: the branch of each say() a Mac never takes)
#   tests/pc_arrange.py      the photo pickers' own machinery (arrange.py): small copies upright and never blown
#                            up, the lock across four programs, "is a slide job at work?", a child that outlives
#                            its starter, saving a record while it is open, a kit too deep for 260 characters, a
#                            copy held by the virus checker ("later"), a full drive, a background run's log lines
#   tests/pc_design.py       the carousel designer's own machinery (design.py), with real JPEGs written in plain
#                            Python so nothing has to be installed: a design saved while its file is open; names
#                            with an accent, an emoji, a word Windows keeps (CON), a dot at the end, 200 letters;
#                            staging and a save start to finish; the save's own process started with no window,
#                            its answer read back in an old code page; a save while a slide in the Carousel folder
#                            is held open by another program; a drive with no hard links; two saves at the same
#                            moment from two processes; the locks across programs; a slide's address past 260
#                            characters refused in plain words before anything is staged; nothing the page is
#                            given holds a path; every refusal of every designer route on the real page server
#                            leaves every file byte for byte as it was
#   tests/pc_reel_page.py    the reel page's own machinery (reel_page.py), nothing installed: Make my reel's
#                            refusals, a test make through its own process, a second press, the lock probe, a job
#                            stopped outright (this_computer.stop_tree), its one time limit, a recording's sound
#                            made once beside it and a new one beside a sound that can't be read; step 1's footage
#                            on header-only videos (one that plays as it is plays, with no strip; one still being
#                            copied in is waited for; the page's PC lines); the chat's footage look (footage.py): no
#                            sheets on a PC (exit 3, in plain words), moments checked and written, their own kept first
#   tests/pc_video.py        the reel's video helper (video.py), nothing installed: the facts read from video headers
#                            built byte by byte (the turn, H.264's profile and colour layout, HEVC, the recording
#                            time, the header at the end or the front, 64-bit boxes), what plays as it is, plain
#                            refusals of what isn't a video, and the named gap: no stills and no small copy on a
#                            PC yet, said in this_computer.NO_PREVIEW (HEVC_HELP for an iPhone's HEVC), nothing made;
#                            a video's sound read where it is (never copied) and brought down as it is read, on our
#                            own 3-second clip (tests/fixtures/loud-tone-3s.mp4) through Media Foundation
#   tests/pc_pictures.py    made-up RAW files from six camera makers, junk and damaged files
#   tests/backup_safety.py   never write over a file, never mix two cards, carry on a cut-off backup,
#                            never copy a card onto itself
#   tests/pc_servers.py      the page servers: a space in the path, never two on one port, the restart
#                            after an update (about 45 seconds)
#   tests/fixtures/check_sound.py   the reel's sound: lengths, the beat, Windows' own Media Foundation
#   tests/reel_timing_check.py      the reel's timing against Nicole's own (her acceptance cases on the synthetic
#                                   60-second test beat; the cases on a client's songs say SKIP here), clips in
#                                   reel.py make, and a clip written into a pretend CapCut project as a video
#   tests/reel_hits_check.py        Nicole's v25: every vibe lands on the song's real hits (the hits you can hear, the
#                                   ticks moved onto them, cuts kept off beats with no hit), on a loose song the test
#                                   writes itself; "No song" in every vibe; whole frames; the chat's reel maker too
#   tests/sheet_numbers_check.py   Nicole's v27: photo numbers stay fixed when photos are added (reel.py sheet is the one
#                                   writer, kit.py sheet hands it the list before; new photos take the next numbers, a photo
#                                   gone keeps its number unused)
#   tests/words_check.py, words_page_check.py, kit_steps_check.py, posting_panel_check.py,
#   posting_reminders_page_check.py   Nicole's v20 and v21: the words for a post, the words page, the kit's three
#                                   steps, the posting queue's panel and its reminder drop-down (--no-chrome here:
#                                   the pages in a browser are checked on the Mac)
#   tests/posting_posted_check.py   Nicole's v27: Posted on the post itself (the posted posts the grid shows, the switch
#                                   back to Not posted, the command line; --no-chrome here)
#   tests/edit_queue_v26_check.py   Nicole's v26, the editing queue: Mark as delivered, Take out of my queue, one
#                                   Find a shoot, Uploaded shoots, Delivered and Archived (--no-chrome on Windows;
#                                   the page in a hidden Chrome on the Mac's page job)
#   tests/home_base_check.py        Nicole's v26, the home base and its two screens: Back up a card (every backup,
#                                   the cards of one shoot as one, a sample never safe to format) and Make posts
#                                   (post kits, Archive and Bring it back) (--no-chrome on Windows; the pages in a
#                                   hidden Chrome on the Mac's page job)
#   tests/report_v26_check.py       Nicole's notes of Nov 13 on the report after a backup: why there are several
#                                   folders (never "days" when it was not days), "Does everything look right?",
#                                   each shoot's own Open this folder (GET open-shoot on the report's server),
#                                   the sneak peeks explained (and never "marked in Lightroom" for JPEGs), the next
#                                   step in place of the old reel line. Its pretend backups need no add-on
#                                   (--no-chrome on Windows; the page in a hidden Chrome on the Mac's page job)
#   tests/edit_queue_v28_check.py, tests/posting_lift_check.py, tests/report_fall_check.py
#                                   Nicole's v28, the animations that only draw: the editing queue's cards dealing in
#                                   and Mark as delivered flipping the card after the save; Posted lifting the post
#                                   into the feed (and ?try=posted changing nothing); the backup report's numbers
#                                   counting up while photos fall into the files box. Their pretend records need no
#                                   add-on (--no-chrome on Windows: the words and the pages as written; the pages in
#                                   a hidden Chrome on the Mac's page job)
#   tests/backup_zero_check.py      a backup with no questions before the copy (Nov 19): one drive is chosen by itself,
#                                   two drives or none is the one question, a set Studio File is never changed
#   tests/second_copy_check.py      Make a second copy, from the report, after the backup (Nov 19): from the card and
#                                   from the drive, a clip turned upright, cut off and finished, never written over,
#                                   every refusal, the report's routes (the button in a hidden Chrome on the Mac's page job)
#   tests/report_options_check.py   the other options on the report (Nov 19): another card joined on one report, the
#                                   folder naming (this backup's shoots renamed to match, by the renamer's own proof),
#                                   the next drive (only the Studio File changes), the note line, the own-disk line,
#                                   and every POST of the report server refused from another page (the panels in a
#                                   hidden Chrome on the Mac's page job)
#   tests/vault_page_check.py      Nicole's v29, My vault first on the post kits list and the vault's own post kit
#                                   page; + Add a shoot (vault.py add: checked copies, originals only read) (a Mac's
#                                   page job, in a hidden Chrome under the guard)
#   tests/vault_reel_check.py      Nicole's v29, the vault's reel page (Nov 19): her four kinds and words, both shoots'
#                                   same-named videos listed apart with keys of their own, add-from (a shoot's clip into
#                                   the vault's reel, refused for a kit not in the vault, an id that is not a clip,
#                                   another Origin), vault.py clips and use-clips, a B-roll test make and Save my video
#                                   from the shoots' own videos, the talking page for the vault, every other post kit
#                                   byte for byte unchanged; the clip search in a hidden Chrome (a Mac's page job, under
#                                   the guard, on self-made clips). Part `photos` (stage 10): her Choose your photos
#                                   step in the vault, the photos folded by shoot, the photo search (tags, words and
#                                   the shoot's name), the line to copy, `vault.py relist --sheets --only`, a test make
#                                   from each photo's own path (the same page job, a step of its own)
#   tests/vault_everything_check.py  Nicole's v29, See everything in it (Nov 19): the vault's own page, her words both
#                                   ways, what it draws with no path in it, a clip played from the vault's own video
#                                   route, Remove from my vault (only the vault's vault.json is written, the version
#                                   before kept, twice changes nothing, refused from another Origin or in a wrong
#                                   shape), Put it back under the same number, a reel that used a removed photo,
#                                   `vault.py out` and `back` (a Mac's page job, in a hidden Chrome under the guard,
#                                   on self-made clips)
#   tests/photo_words_check.py     Nicole's v29, what is in each photo kept beside the kit so search finds it, and
#                                   her search rule (Nov 19): a pretend classifier, the store written whole with the
#                                   version before kept, describe refusing a bad file whole, the job and her line
#                                   "Getting your photos ready to search", every photo byte for byte unchanged and
#                                   none renamed, the vault's catalog and find, a pretend PC; one real look by the
#                                   Mac's own Vision that may SKIP (a Mac's page job, in a hidden Chrome under the guard)
#   tests/vault_core_check.py      Nicole's v29, the vault as a real post kit whose photo list is references (Nov 19):
#                                   made once, same-named photos from two shoots as two numbers, numbers that never
#                                   move, every other post kit byte for byte unchanged, the readers, the page server
#                                   by request (a Mac: the pretend photos are drawn with sips; no browser needed)
#   tests/home_v29_check.py         Nicole's v29, the home page with posts first: the big Turn your shoots into posts
#                                   card and its one button, My posting queue, "Also in your Assistant" with the two
#                                   smaller cards, no list of post kits, no numbered steps (a Mac, as home_v28_check:
#                                   --no-chrome on the Mac job, the page in a hidden Chrome on the Mac's page job)
#   tests/home_v28_check.py, tests/wrapped_check.py
#                                   Nicole's v28, the home page rebuilt (the hello, the face finder, her four steps,
#                                   the monthly recap card, the Your year bar) and Your year and the monthly recap as
#                                   stories (the counts, the routes, saving a story as a picture). Their pretend kits
#                                   are drawn with the Mac's sips, so on a PC they would only say SKIP and are not
#                                   listed there: --no-chrome on the Mac job (everything but the page), the pages in
#                                   a hidden Chrome on the Mac's page job
#   tests/kit_fan_check.py          Nicole's v28, the post kit's photo fan (the first time a kit opens): the real page
#                                   only, and its pretend kit is drawn with the Mac's sips, so the Mac's page job only
#   tests/reminders_check.py        posting-day reminders themselves (reminders.py), against a pretend calendar and
#                                   never a real one: Nicole's 19 checks, the calendar file a PC gets (its shape,
#                                   the steady id per post, a cancel), the merge and the races, the command line.
#                                   Added Nov 11: it had been left out, so the PC's calendar file was never tried
#                                   on Windows.
#   tests/skill_text_check.py       the instructions say what the scripts do (standard library only, reads only)
#   tests/peek_check.py             the face check before the sneak peeks (pretend faces; on a Mac one real Vision
#                                   run) and the pick that demands a checked line per photo and refuses what the
#                                   check flagged (Dustin, Nov 12). Needs Pillow for the pretend backup.
#   tests/shoot_report_check.py     one report for a shoot on several cards (shoot_report.py, the report's card mode,
#                                   the server's /card/N/ routes), on two pretend backups. Needs Pillow.
#   tests/talking_engine_check.py, talking_rec_check.py, talking_capcut_check.py, pc_talking.py,
#   talking_page_check.py           Nicole's v23 and v24, the talking-to-camera reel (added Nov 12; standard library
#                                   only, pretend kits, the one tiny clip in tests/fixtures read by its header): the
#                                   arithmetic against her numbers worked by hand; the record, a save from the page
#                                   field by field and the chat's commands; the CapCut project written into a pretend
#                                   projects folder; the PC line (Edit my video answers at once and makes nothing);
#                                   and the page's routes and refusals (--no-chrome on Windows).
#   tests/capcut_even.py            Mac job only (a SKIP on a PC): today's photo reels are byte for byte the projects
#                                   kept from before the talking reel's builder went into capcut.py.
#   tests/guard_check.py            Mac job only: the memory guard (tests/guard.py) the video and Chrome tests run under.
#   tests/transcribe_check.py       a job of its own on the Mac, "mac-talking", under the guard: turning a talking
#                                   video into words with the PRETEND transcriber only (the real app is never built
#                                   or started, so macOS never asks anything), on 6-second clips the Mac makes itself.
#   tests/talking_multi_check.py    several clips picked at once on the talking reel's timeline (Dustin, Nov 12): by
#                                   request on Windows (--no-chrome), and the real page with real Command, Ctrl and
#                                   Shift clicks in the "mac-page" job below.
#   tests/talking_menus_check.py    the two small menus for Speed and Zoom on the talking reel's timeline (Dustin,
#                                   Nov 13, in place of the chips): our two words and the bar by request on Windows
#                                   (--no-chrome), and the real page with a real mouse and keys in "mac-page".
#   tests/talking_snap_check.py     the centered line on the talking reel's preview (Dustin, Nov 13; ours): the
#                                   line in the page and its styles by request on Windows (--no-chrome), and real
#                                   drags of the caption, a photo and themselves in the corner in "mac-page".
#   tests/reels_check.py            Nicole's v25, several reels from one shoot (Nov 14): the "Your reels" bar on the reel
#                                   page and "Your talking reels" on the talking reel page, every reel fully separate,
#                                   the chat's commands on the reel being worked on or the one named. By request on
#                                   Windows (--no-chrome) and in "mac-page" with the pages in a hidden Chrome. Its
#                                   byte-for-byte check against the code before the stage needs that commit in git,
#                                   which GitHub's shallow copy has not: it says SKIP there.
#   tests/picks_ask_check.py        Nicole's v25, the photographer picks (Nov 14): nothing picked until they ask, the
#                                   photo note saved per reel, reel_page.py note (what the assistant reads before it
#                                   picks), a new kit that picks and makes nothing. By request on Windows
#                                   (--no-chrome) and in "mac-page" with the note box on the real page.
#   tests/reel_trim_select_check.py Nicole's v25, Trim a clip and select several photos like Lightroom (Nov 14): her
#                                   words, a trim by request (1 to 15 seconds, never past the video's ends) on the
#                                   3-second clip in tests/fixtures. By request on Windows (--no-chrome) and in
#                                   "mac-page" with real Shift, Cmd and Ctrl clicks, real drags, and the trim panel
#                                   on a 40-second clip the test makes with the Mac's own tools.
#   tests/kit_reels_queue_check.py  Nicole's v25, the post kit and the posting queue with several reels, captions
#                                   optional (Nov 14): Add to my queue once the piece is made, the caption question
#                                   in a box on the page, a preview of each reel, "Which reel goes in your queue?",
#                                   each reel its own piece (no id renamed), the reel cover picker in play order,
#                                   reminders per reel on a pretend calendar. By request on Windows (--no-chrome)
#                                   and in "mac-page" with the kit page and the posting page in a hidden Chrome.
#   tests/reel_v27_page_check.py    Nicole's v27, the reel page rebuilt (Nov 17, Lane A stage 2): the chooser of four
#                                   kinds and each kind its own page, a reel's own kind, new photos numbered on the
#                                   page's own poll with every other number kept, the song drop-down with Listen and
#                                   Remove this song, Add this reel to my posting queue. By request on Windows
#                                   (--no-chrome) and in "mac-page" with the pages in a hidden Chrome.
#   tests/reel_footage_check.py     Nicole's v27, Lane A stage 3 (Nov 17): the footage editor on the real page (the trim dragged
#                                   on the timeline, Your clips) and clip naming from the chat, in "mac-page" under the guard.
#                                   Since stage 5, tests/video_check.py (the Mac job) also renders the finished B-roll video
#                                   (Save my video) and tests/reel_watch_check.py presses Save my video on the page.
#   tests/reel_watch_check.py       Nicole's v27, Lane A stage 4 (Nov 17): Watch your reel before you make it (the preview's
#                                   pieces from reel.py's dry run, Try another mix, Another part of this song, Undo and
#                                   Redo, Make this one in CapCut carrying the watched mix), Would you like to direct this
#                                   edit? (the note, reel_page.py direct), B-roll on the page (clips only, the words on
#                                   screen dragged into place and into the CapCut project). In "mac-page", under the
#                                   800 MB guard, on self-made clips, the page parts in a hidden Chrome.
#   tests/songs_check.py            Nicole's v25, songs (Nov 14): a short song starts after a glitchy opening (what
#                                   ffmpeg's silencedetect would call a silence, measured in plain Python), a replaced
#                                   recording gets its sound taken again ("<name> sound 2"); and Remove this song (her
#                                   v27, Nov 17): POST /reel-song-remove sends a song, and every sound taken from a
#                                   recording, to the Trash (the run's own folder through the tests' switch; the real
#                                   Trash is never touched), clears the open reel's pick, leaves a second reel alone,
#                                   and refuses the rest with nothing moved. No server, no browser, no ffmpeg: the
#                                   whole file on Windows and on the Mac.
#   tests/bring_older_check.py      Reels and talking reels made on the older pages, brought into their post kits
#                                   (bring_older.py, Nov 18): look changes nothing, photo numbers matched by file
#                                   name, nothing written over, safe to run twice, a cut-off run finished by the next
#   tests/trash_check.py            The Trash helper (Nicole's v27, Nov 17): this_computer.trash moves a file or a
#                                   folder to the computer's own Trash (Finder's on a Mac; the Recycle Bin on a PC by
#                                   Windows' own call, nothing installed) and is never a delete; it refuses a link, a
#                                   path outside the one folder it is told, and a drive with no Trash; trash_many
#                                   checks every path before the first move. In a test the switch sends items into
#                                   the test's own folder, so the real Trash is never touched, and the real routes are
#                                   tried with a stand-in. No server, no browser: the whole file on Windows and on
#                                   the Mac (the PC branch's first real run is this job).
#   tests/loose_ends_v26_check.py   Nicole's v25 and v26, the smaller changes and loose ends (Nov 14): no page tells
#                                   them to talk to "Claude" (every page says "your assistant"); every shoot in Your
#                                   Content with a kit record is listed, also one whose page was never written; the
#                                   instructions, where-things-live and both setup guides no longer describe what the
#                                   home base, the post kit and sets of stories replaced. No server, no browser, no
#                                   add-on: the whole file on Windows and on the Mac.
#   tests/talking_page_check.py (whole), tests/design_preview_check.py, tests/kit_cards_check.py
#                                   a job of its own on the Mac, "mac-page", which may fail without failing the check
#                                   (as windows-page: nobody has seen these pages in GitHub's Chrome yet): the talking
#                                   reel's real page, the designer's small preview picture for the post kit, and the
#                                   post kit's cards showing that picture (kit_cards_check draws its pretend kit with
#                                   the Mac's sips, so it is Mac only: on a PC only the /design-preview routes are
#                                   tried, in pc_design.py), in a hidden Chrome, one at a time under the guard.
#                                   None of these has run on GitHub yet: the first push is the test.
#   tests/design_v27_check.py       Nicole's v27 for both designers, in "mac-page" too: the ask box and design.py note / fill
#                                   on a carousel, her three story collages, Open folder, the [hidden] rule, slides as things
#                                   (+ and x, Where should it go?, the grip), Show the whole photo, the Crop window, several
