    # Turning a talking video into words (Nicole's v23), with the PRETEND transcriber only: the real app is never
    # built or started here, so macOS is never given a reason to ask about Speech Recognition. The clips are 6 seconds
    # long and made here by the Mac's own AVFoundation. One video test at a time, under the memory guard.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Turning a talking video into words (the pretend transcriber, the sound, the job, its limits and its tidy-up), on the Mac's own Python 3.9
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 tests/guard.py 800 /usr/bin/python3 tests/transcribe_check.py
      - name: The same on the newest Python this machine carries
        if: ${{ !cancelled() }}
        run: python3 tests/guard.py 800 python3 tests/transcribe_check.py
